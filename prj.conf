# TF-M config
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General config
CONFIG_SERIAL=y

# Shell, for sending UDP data manually with "udp send <text>"
CONFIG_SHELL=y

# AT shell, so raw AT commands can be issued at runtime with "at <cmd>".
# Used to interrogate the modem live (e.g. "at AT+CEER", "at AT+CEREG?") while
# debugging registration, mirroring the manual AT sequence that works.
CONFIG_AT_SHELL=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_NTN_NBIOT=y

# Disable PLMN selection optimization. lte_lc enables it by default (AT%FEACONF=
# 0,3,1) to speed up the initial search for stationary *terrestrial* devices, but
# on Skylo NTN it makes the modem reject the satellite PLMN ("no suitable cell",
# reg status 91). The known-good manual AT sequence never sets %FEACONF, so leave
# the optimization off to match it.
CONFIG_LTE_PLMN_SELECTION_OPTIMIZATION=n

# Modem library
CONFIG_NRF_MODEM_LIB=y

# Release Assistance Indication. Skylo requires the device to signal RAI so the
# NTN connection is released as soon as the exchange is finished, rather than
# lingering until the network inactivity timer expires. The module enables RAI in
# the modem (AT%RAI=2) and reports what each cell grants (LTE_LC_EVT_RAI_UPDATE);
# the app then applies it per exchange with the SO_RAI socket option.
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y

# NTN (Non-Terrestrial Network) helper library
CONFIG_NTN=y

# Wall-clock time for the %t payload token. Sources modem/network time (NITZ)
# first and falls back to NTP over the IP connection. No battery RTC, so %t
# reads 0 until time is acquired from one of these sources.
CONFIG_DATE_TIME=y

# Time comes from GNSS in the dynamic modes (the PVT frame carries UTC), so the
# settings below only matter for GNSS_MODE_STATIC, where GNSS never runs.
#
# The NTP default of a 5 s query budget cannot complete over a link with a 10-20 s
# round trip. But date_time tries TWO servers in sequence, each getting this full
# budget plus an unbounded DNS lookup, so a large value overruns the startup wait
# before either server reports. 20 s is long enough for one exchange and short
# enough that both attempts fit inside CONFIG_TIME_SYNC_WAIT_S.
CONFIG_DATE_TIME_NTP_QUERY_TIME_SECONDS=20
CONFIG_DATE_TIME_RETRY_COUNT=3
CONFIG_DATE_TIME_RETRY_INTERVAL_SECONDS=60

# Block at startup (after the first attach) until time is obtained, so the very
# first payload carries a real ts. 0 disables the wait.
CONFIG_TIME_SYNC_WAIT_S=120

# Floating-point printf support. AT%LOCATION=2 formats the coordinates with %f
# (both ntn_location_set() and this app's set_initial_location()). picolibc
# omits float conversion unless this is set, which would send blank coordinates
# and leave the modem searching for a satellite forever.
CONFIG_PICOLIBC_IO_FLOAT=y

# Heap and stacks. Main stack bumped for the GNSS acquisition / re-attach path
# (nested modem calls plus float-formatted logging under picolibc).
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=4096

# LooUQ test
# Do NOT allocate a dedicated CID: the APN must be set on the default context
# (cid 0), which is what the LTE attach uses. With a new CID the attach context
# stays blank and the Skylo network rejects the PDN half of the attach
# (AT+CEER reports "EMM 19" = ESM failure), so registration never completes.
CONFIG_UDP_ALLOC_NEW_CID=n
CONFIG_UDP_APN="go.mono"

# override default bandlist to Skylo test requiements. The modem will scan only these bands for faster registration.
# This feeds AT%XBANDLOCK in modem_init(); CONFIG_LTE_BAND_LIST is not a real symbol.
CONFIG_NTN_BAND_LIST="255"

# set these to your real UDP server endpoint
CONFIG_UDP_SERVER_ADDRESS="udp.tip.us-e1.tago.io"
CONFIG_UDP_SERVER_PORT=5683

# Wait this long after sending before listening for the reply (high-latency NTN).
# Tune to taste; 0 disables.
CONFIG_UDP_RECV_DELAY_MS=500
# How long recv() waits for a reply before logging "No reply". Skylo NTN round
# trips are far longer than terrestrial NB-IoT, so give the reply real time to
# arrive. Each send now logs how long the reply actually took ("Received N bytes
# after X.X s"), so tune this from those numbers rather than by feel. Note the
# cost when nothing replies: every cycle blocks here for the full timeout.
CONFIG_UDP_RECV_TIMEOUT_S=60

# Apply RAI on the UDP socket: RAI_ONE_RESP before the send (one reply expected),
# RAI_NO_DATA once the exchange completes. Set CONFIG_UDP_RAI_EXPECT_REPLY=n if the
# server never replies, so RAI_LAST is used and the link drops right after the send.
CONFIG_UDP_RAI=y
CONFIG_UDP_RAI_EXPECT_REPLY=y

# Location source. Pick exactly one mode:
#   CONFIG_GNSS_MODE_STATIC=y         fixed position from CONFIG_NTN_LOCATION, GNSS
#                                     never runs (bench testing / poor sky view)
#   CONFIG_GNSS_MODE_DYNAMIC_ONCE=y   one GNSS fix at boot, reused afterwards (a full
#                                     re-acquire only when the modem asks and the fix
#                                     is older than CONFIG_NTN_REFIX_MIN_INTERVAL_S)
#   CONFIG_GNSS_MODE_DYNAMIC_EVERY=y  duty-cycle NTN and GNSS. Each interval: send,
#                                     release with RAI, then track GNSS continuously
#                                     until the next send. GNSS and NTN are mutually
#                                     exclusive, so each cycle costs a detach +
#                                     re-attach; keep CONFIG_TEST_INTERVAL long
#                                     enough to absorb it.
CONFIG_GNSS_MODE_DYNAMIC_EVERY=y

# dynamic-every only: throttle for per-fix logging while tracking (0 = log every fix,
# which is once per second in continuous navigation mode).
CONFIG_GNSS_TRACK_LOG_INTERVAL_S=30

# Fixed position (decimal degrees, altitude in meters), used by GNSS_MODE_STATIC only.
# Example below is LooUQ, Traverse City, MI, USA.
CONFIG_NTN_LOCATION="44.698883,-85.600258,153.025009"

# GNSS fix retry timeout (s); 0 = run until a valid fix (block until fix).
CONFIG_GNSS_FIX_RETRY_S=0
# Validity (s) reported with each NTN location update; finite so the modem asks for
# refreshes. 0 = infinite (permanently stationary device).
CONFIG_NTN_LOCATION_VALIDITY_S=3600
# Reuse the cached GNSS fix for modem location requests newer than this; older ones
# trigger a full re-acquire (which briefly drops the NTN link).
CONFIG_NTN_REFIX_MIN_INTERVAL_S=600
# COEX0 command that gates the external GNSS LNA/RF path. Board-specific for the
# MTC2-N9151; empty string skips it. Default enables COEX0 over the GPS L1 band.
CONFIG_GNSS_COEX0_CMD="AT%XCOEX0=1,1,1570,1580"

# Skylo LooUQ test parameters
CONFIG_TEST_NAME="MONSKY_FTM"
CONFIG_TEST_INTERVAL=120
# CONFIG_TAGO_DEVICE_TOKEN and CONFIG_TAGO_HASH live in secrets.conf (not
# committed). Copy secrets.conf.example to secrets.conf and fill them in.

# Template for TagoIO TIP payload. Tokens will be replaced at runtime with real values. 
# See the app code for details.
# Tokens: %n name, %c counter, %r RSRP dBm, %q RSRQ dB, %s SNR dB, %t unix epoch seconds,
#         %l position as "lat,lon" (TagoIO TIP location field), %% literal %
CONFIG_TEST_PAYLOADTEMPLATE="PUSH|%h|%i|[tid=%n;ts:=%t;seq:=%c;rsrp:=%r;rsrq:=%q;sinr:=%s;location@=%l]"
